<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carlos Mendez Chiriboga — Portfolio</title>
    <meta
      name="description"
      content="Personal portfolio of Carlos Mendez Chiriboga, incoming Computer Science student at Case Western Reserve University."
    />

    <!-- Google Fonts — elegant serifs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://raw.githubusercontent.com/sthpl03/Portfolio/refs/heads/main/favicon.ico"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ============ PANNABLE WORLD ============ -->
    <div id="world">
      <!-- SVG connection lines (drawn by JS, hidden until clicked) -->
      <svg id="connections-svg" aria-hidden="true"></svg>

      <!-- CENTRAL NODE — Carlos's name -->
      <div class="center-node" id="center-node">
        <span class="center-node__name">Carlos Mendez<br />Chiriboga</span>
        <span class="center-node__subtitle">Computer Science · AI · Cybersecurity</span>
        <div class="center-node__divider"></div>
      </div>

      <!-- CATEGORY NODES — positioned randomly by JS -->
      <div class="category-node" id="node-education" data-section="education">
        <div class="category-node__ring">
          <span class="category-node__icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
              <path d="M6 12v5c3 3 9 3 12 0v-5" />
            </svg>
          </span>
        </div>
        <span class="category-node__label">Education</span>
      </div>

      <div class="category-node" id="node-experience" data-section="experience">
        <div class="category-node__ring">
          <span class="category-node__icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
            </svg>
          </span>
        </div>
        <span class="category-node__label">Experience</span>
      </div>

      <div class="category-node" id="node-projects" data-section="projects">
        <div class="category-node__ring">
          <span class="category-node__icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="16 18 22 12 16 6" />
              <polyline points="8 6 2 12 8 18" />
            </svg>
          </span>
        </div>
        <span class="category-node__label">Projects</span>
      </div>

      <div class="category-node" id="node-skills" data-section="skills">
        <div class="category-node__ring">
          <span class="category-node__icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
          </span>
        </div>
        <span class="category-node__label">Skills</span>
      </div>

      <div class="category-node" id="node-competitions" data-section="competitions">
        <div class="category-node__ring">
          <span class="category-node__icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="8" r="7" />
              <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" />
            </svg>
          </span>
        </div>
        <span class="category-node__label">Competitions</span>
      </div>

      <div class="category-node" id="node-contact" data-section="contact">
        <div class="category-node__ring">
          <span class="category-node__icon">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
              />
              <polyline points="22,6 12,13 2,6" />
            </svg>
          </span>
        </div>
        <span class="category-node__label">Contact</span>
      </div>
    </div>

    <!-- ============ PAN HINT ============ -->
    <div class="pan-hint" id="pan-hint">drag to explore</div>

    <!-- ============ MODAL ============ -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-card" id="modal-card" role="dialog" aria-modal="true">
        <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
        <div id="modal-content"></div>
      </div>
    </div>

    <!-- ============ BOTTOM BAR ============ -->
